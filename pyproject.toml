[tool.poetry]
name = "yopd"
version = "0.1.0"
description = "YOPD fMRI preprocessing pipeline"
authors = ["sukiperumal <vsukiperumal@gmail.com>"]
readme = "README.md"
packages = [{include = "pipeline"}]

[tool.poetry.dependencies]
python = ">=3.10"
fmriprep-docker = ">=25.2.3"
typer = ">=0.9.0"
numpy = ">=1.21.0"
pandas = ">=1.3.0"
nibabel = ">=3.2.0"
nilearn = ">=0.9.0"
scipy = ">=1.7.0"
networkx = ">=2.8.0"
scikit-learn = ">=1.0.0"
matplotlib = ">=3.5.0"
seaborn = ">=0.11.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
preprocess = "pipeline.preprocess:app"
preprocess-optimized = "pipeline.preprocess_optimized:app"
build-graphs = "pipeline.build_graphs:app"
analyze-graphs = "pipeline.graph_analysis:run_complete_analysis"
graph-pipeline = "pipeline.graphs:app"
graph-t1w = "pipeline.graph_t1w:construct_structural_graph_cli"
graph-fmri = "pipeline.graph_fmri:construct_functional_graph_cli"
graph-merge = "pipeline.graph_merge:integrate_multimodal_graphs_cli"
multimodal-pipeline = "pipeline.pipeline_multimodal:app"