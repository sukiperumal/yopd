[tool.poetry]
name = "yopd"
version = "0.1.0"
description = "YOPD fMRI preprocessing pipeline"
authors = ["sukiperumal <vsukiperumal@gmail.com>"]
readme = "README.md"
packages = [{include = "pipeline"}]

[tool.poetry.dependencies]
python = ">=3.10"
fmriprep-docker = ">=25.2.3"
typer = ">=0.9.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
preprocess = "pipeline.preprocess:app"
preprocess-optimized = "pipeline.preprocess_optimized:app"